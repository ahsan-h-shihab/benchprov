[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchprov"
version = "0.1.0"
description = "Benchmark Provenance: machine-readable provenance for multilingual and translated NLP benchmarks (translation method, engine, human verification, lineage, license - every claim evidence-backed)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahsan Habib Shihab" }]
keywords = ["nlp", "benchmarks", "multilingual", "provenance", "machine-translation", "evaluation", "datasets"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]
fetch = ["requests>=2.28", "huggingface_hub>=0.20"]

[project.scripts]
benchprov = "benchprov.cli:main"

[project.urls]
Repository = "https://github.com/ahsan-h-shihab/benchprov"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchprov = ["_data/provenance.schema.json", "_data/families.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
